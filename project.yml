name: SlyyMail
options:
  bundleIdPrefix: ai.slyy
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
packages:
  SlyyMailKit:
    path: Packages/SlyyMailKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.4"
settings:
  base:
    MARKETING_VERSION: "0.5.0"
    # CI sets this to the run number so every release has a higher CFBundleVersion (Sparkle compares it).
    CURRENT_PROJECT_VERSION: "1"
    # Filled by CI from the SPARKLE_PRIVATE_KEY secret; empty = updater off.
    SPARKLE_PUBLIC_KEY: ""
    SWIFT_VERSION: "5.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
    SWIFT_EMIT_LOC_STRINGS: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  SlyyMail-macOS:
    type: application
    platform: macOS
    scheme:
      testTargets: [SlyyMailrTests]
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: SlyyMailKit
      - package: Sparkle
    info:
      path: App/Generated/Info-macOS.plist
      properties:
        SUFeedURL: https://github.com/mySlyy/slyy-mailr/releases/latest/download/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        SUEnableInstallerLauncherService: true
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUAllowsAutomaticUpdates: true
        SUScheduledCheckInterval: 21600
        SUVerifyUpdateBeforeExtraction: true
        CFBundleDisplayName: Slyy Mailr
        CFBundleName: Slyy Mailr
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSCameraUsageDescription: Slyy Mailr uses the camera for video calls.
        NSMicrophoneUsageDescription: Slyy Mailr uses the microphone for video calls.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: Email Address URL
            CFBundleURLSchemes: [mailto]
            LSHandlerRank: Owner
    entitlements:
      path: App/Generated/SlyyMail-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.downloads.read-write: true
        # Shared Slyy app group: Slyy Haven's socket lives in its container. CI fills in the Team ID when signing.
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)ai.slyy
        # Sparkle's installer runs outside the sandbox and is reached over these XPC names.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - ai.slyy.mailr-spks
          - ai.slyy.mailr-spki
        # Cleanup: the app from before the rename, and mounted installer disks.
        com.apple.security.temporary-exception.files.absolute-path.read-write:
          - "/Applications/Slyy Mail.app/"
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - "/Applications/Slyy Mail.app/"
        com.apple.security.temporary-exception.files.absolute-path.read-only:
          - "/Volumes/"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.slyy.mailr
        PRODUCT_NAME: Slyy Mailr
        PRODUCT_MODULE_NAME: SlyyMailr
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_TESTABILITY: YES
        COMBINE_HIDPI_IMAGES: YES
  SlyyMail-iOS:
    type: application
    platform: iOS
    scheme:
      testTargets: [SlyyMailrTests-iOS]
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: SlyyMailKit
    info:
      path: App/Generated/Info-iOS.plist
      properties:
        CFBundleDisplayName: Slyy Mailr
        CFBundleName: Slyy Mailr
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: Slyy Mailr uses the camera for video calls.
        NSMicrophoneUsageDescription: Slyy Mailr uses the microphone for video calls.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: Email Address URL
            CFBundleURLSchemes: [mailto]
        UIBackgroundModes: [audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [ai.slyy.mailr.refresh]
        # Only standard TLS (exempt): skips the export-compliance question for every TestFlight build.
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: Slyy Mailr saves attachments you choose to your photo library.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.slyy.mailr
        PRODUCT_NAME: Slyy Mailr
        PRODUCT_MODULE_NAME: SlyyMailr
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
  SlyyMailrTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App/Tests
    dependencies:
      - target: SlyyMail-macOS
      - package: SlyyMailKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.slyy.mailr.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Slyy Mailr.app/Contents/MacOS/Slyy Mailr"
        BUNDLE_LOADER: "$(TEST_HOST)"
  SlyyMailrTests-iOS:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/Tests
    dependencies:
      - target: SlyyMail-iOS
      - package: SlyyMailKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.slyy.mailr.tests-ios
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Slyy Mailr.app/Slyy Mailr"
        BUNDLE_LOADER: "$(TEST_HOST)"
