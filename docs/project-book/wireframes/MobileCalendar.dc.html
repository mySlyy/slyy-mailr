<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slyy Mailr mobile day view</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Martian+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#2b3bff}a:hover{color:#1f2ed0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; color: #0a0a0a; font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 15px; overflow: hidden;">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 18px 8px;">
    <span style="font-weight: 700; font-size: 20px; letter-spacing: -0.02em;">November</span>
    <a href="#" aria-label="New event" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; background: #0a0a0a; color: #ffffff;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg></a>
  </header>

  <div role="group" aria-label="Choose day" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); padding: 0 10px 10px; border-bottom: 1px solid #e2e2e2; text-align: center; font-size: 12px; color: #5c5c5c;">
    <button type="button" style="border: none; background: none; padding: 6px 0; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #5c5c5c;">Mo<span style="font-size: 16px; color: #0a0a0a;">23</span></button>
    <button type="button" style="border: none; background: none; padding: 6px 0; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #5c5c5c;">Tu<span style="font-size: 16px; color: #0a0a0a;">24</span></button>
    <button type="button" style="border: none; background: none; padding: 6px 0; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #5c5c5c;">We<span style="font-size: 16px; color: #0a0a0a;">25</span></button>
    <button type="button" aria-pressed="true" style="border: none; background: none; padding: 6px 0; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #2b3bff; font-weight: 600;">Th<span style="font-size: 16px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: #2b3bff; color: #ffffff; border-radius: 50%;">26</span></button>
    <button type="button" style="border: none; background: none; padding: 6px 0; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #5c5c5c;">Fr<span style="font-size: 16px; color: #0a0a0a;">27</span></button>
    <button type="button" style="border: none; background: none; padding: 6px 0; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #5c5c5c;">Sa<span style="font-size: 16px; color: #5c5c5c;">28</span></button>
    <button type="button" style="border: none; background: none; padding: 6px 0; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #5c5c5c;">Su<span style="font-size: 16px; color: #5c5c5c;">29</span></button>
  </div>

  <div style="flex: 1 1 auto; display: grid; grid-template-columns: 52px minmax(0, 1fr); position: relative; overflow: hidden;">
    <div style="display: grid; grid-template-rows: repeat(9, 64px); font-size: 11px; color: #5c5c5c;">
      <span style="padding: 2px 8px; text-align: right;">09:00</span><span style="padding: 2px 8px; text-align: right;">10:00</span><span style="padding: 2px 8px; text-align: right;">11:00</span><span style="padding: 2px 8px; text-align: right;">12:00</span><span style="padding: 2px 8px; text-align: right;">13:00</span><span style="padding: 2px 8px; text-align: right;">14:00</span><span style="padding: 2px 8px; text-align: right;">15:00</span><span style="padding: 2px 8px; text-align: right;">16:00</span><span style="padding: 2px 8px; text-align: right;">17:00</span>
    </div>
    <div style="position: relative; border-left: 1px solid #e2e2e2; background: repeating-linear-gradient(#ffffff 0 63px, #e2e2e2 63px 64px);">
      <a href="#" style="position: absolute; top: 192px; height: 62px; left: 4px; right: 8px; box-sizing: border-box; background: #fbe4d0; border-top: 3px solid #d9730d; padding: 4px 8px; color: #0a0a0a; text-decoration: none; font-size: 13px; opacity: 0.55;"><strong>Mittag Team</strong> · declined</a>
      <span aria-hidden="true" style="position: absolute; top: 300px; left: 0; right: 0; height: 2px; background: #2b3bff;"></span>
      <div style="position: absolute; top: 320px; height: 120px; left: 4px; right: 8px; box-sizing: border-box; background: #e6e8ff; border-top: 3px solid #2b3bff; padding: 6px 8px; display: flex; flex-direction: column; gap: 4px;">
        <strong>Kundentermin Schott</strong>
        <span style="font-size: 13px; color: #3d3d3d;">14:00 – 16:00 · video call</span>
        <a href="MobileReminder.dc.html" style="align-self: flex-start; margin-top: auto; height: 36px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; background: #2b3bff; color: #ffffff; text-decoration: none; font-weight: 600; font-size: 14px;"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="12" height="12"/><path d="M15 10l6-3v10l-6-3"/></svg>Join</a>
      </div>
    </div>
  </div>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #e2e2e2; padding: 6px 4px 22px; font-size: 11px;">
    <a href="MobileInbox.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: #3d3d3d; text-decoration: none;"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18v12H3z"/><path d="M3 7l9 6 9-6"/></svg>Mail</a>
    <a href="MobileCalendar.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: #2b3bff; text-decoration: none; font-weight: 600;"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="15"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Calendar</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: #3d3d3d; text-decoration: none;"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Settings</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
