name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      testflight:
        description: "Upload this build to TestFlight even if the version is already released"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 100
    env:
      # Optional secrets; steps that need them are skipped when empty.
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        shell: bash
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
          swift --version

      - name: Register error matcher
        run: echo "::add-matcher::.github/swift-matcher.json"

      - name: Core library tests
        shell: bash
        env:
          SLYY_NET: "1"
        run: swift test --package-path Packages/SlyyMailKit 2>&1 | tail -n 80

      - name: Generate Xcode project
        shell: bash
        run: |
          brew install xcodegen >/dev/null
          xcodegen generate

      - name: Update signing key (Sparkle EdDSA)
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet cryptography
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::warning::SPARKLE_PRIVATE_KEY not set: automatic updates are off in this build and it will not be released."
            exit 0
          fi
          PUB=$("$RUNNER_TEMP/venv/bin/python" Tools/release/sparkle_sign.py public)
          echo "SPARKLE_PUBLIC_KEY=$PUB" >> "$GITHUB_ENV"
          echo "Update public key: $PUB"

      - name: Build macOS app (Apple Silicon)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project SlyyMail.xcodeproj -scheme SlyyMail-macOS -configuration Release \
            -derivedDataPath build -destination 'generic/platform=macOS' \
            ARCHS="arm64" ONLY_ACTIVE_ARCH=NO \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" SPARKLE_PUBLIC_KEY="$SPARKLE_PUBLIC_KEY" \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build-macos.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build-macos.log
          # Apple Silicon only: thin the frameworks that ship universal (Sparkle), then make sure no Intel code is left.
          APP="build/Build/Products/Release/Slyy Mailr.app"
          find "$APP" -type f -print0 | while IFS= read -r -d '' f; do
            if lipo -info "$f" 2>/dev/null | grep -q "Architectures in the fat file"; then
              lipo "$f" -thin arm64 -output "$f.thin" && mv "$f.thin" "$f" && echo "thinned: ${f#$APP/}"
            fi
          done
          if find "$APP" -type f -exec lipo -info {} \; 2>/dev/null | grep -q x86_64; then
            echo "::error::x86_64 code left in the app"; exit 1
          fi

      - name: Build iOS app (simulator, compile check)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project SlyyMail.xcodeproj -scheme SlyyMail-iOS -configuration Debug \
            -derivedDataPath build-ios -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-ios.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build-ios.log

      - name: App tests and screenshots (iPhone simulator)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p screens-ios
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          phones = [x for k, v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro' not in x['name'] and 'Plus' not in x['name']]
          print(phones[-1]['udid'] if phones else '')")
          test -n "$UDID" || { echo "::error::No iPhone simulator on this runner"; exit 1; }
          xcrun simctl list devices | grep "$UDID"
          TEST_RUNNER_SLYY_SNAPSHOT_DIR="$PWD" xcodebuild test -project SlyyMail.xcodeproj -scheme SlyyMail-iOS \
            -destination "id=$UDID" -derivedDataPath build-ios-test CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test-ios.log | grep -E "error:|Test Case .*(passed|failed)|TEST (SUCCEEDED|FAILED)|Executed" || true
          grep -q "TEST SUCCEEDED" test-ios.log

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screens-ios
          path: screens-ios/*.png
          if-no-files-found: warn

      - name: App tests and screenshots (macOS)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p screens
          # Tests run without the sandbox so the screenshots can be written outside the app container.
          TEST_RUNNER_SLYY_SNAPSHOT_DIR="$PWD" xcodebuild test -project SlyyMail.xcodeproj -scheme SlyyMail-macOS \
            -destination 'platform=macOS' -derivedDataPath build-test \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" CODE_SIGN_ENTITLEMENTS="" ENABLE_HARDENED_RUNTIME=NO \
            2>&1 | tee test-app.log | grep -E "error:|Test Case .*(passed|failed)|TEST (SUCCEEDED|FAILED)|Executed" || true
          grep -q "TEST SUCCEEDED" test-app.log

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screens
          path: screens/*.png
          if-no-files-found: warn

      - name: Sign app with Developer ID (when MACOS_CERT_P12 is set)
        if: ${{ env.MACOS_CERT_P12 != '' }}
        shell: bash
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          APP="build/Build/Products/Release/Slyy Mailr.app"
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPW=$(uuidgen)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          test -n "$IDENTITY" || { echo "::error::No Developer ID Application identity in MACOS_CERT_P12"; exit 1; }
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          # Inside-out: Sparkle's helpers keep their own (unsandboxed) setup, then other frameworks, then the app.
          FW="$APP/Contents/Frameworks/Sparkle.framework"
          if [ -d "$FW" ]; then
            V="$FW/Versions/Current"
            [ -e "$V/XPCServices/Installer.xpc" ] && codesign --force --options runtime --timestamp -s "$IDENTITY" "$V/XPCServices/Installer.xpc"
            [ -e "$V/XPCServices/Downloader.xpc" ] && codesign --force --options runtime --timestamp --preserve-metadata=entitlements -s "$IDENTITY" "$V/XPCServices/Downloader.xpc"
            [ -e "$V/Autoupdate" ] && codesign --force --options runtime --timestamp -s "$IDENTITY" "$V/Autoupdate"
            [ -e "$V/Updater.app" ] && codesign --force --options runtime --timestamp -s "$IDENTITY" "$V/Updater.app"
            codesign --force --options runtime --timestamp -s "$IDENTITY" "$FW"
          fi
          find "$APP/Contents/Frameworks" -maxdepth 1 \( -name "*.framework" -o -name "*.dylib" \) ! -name "Sparkle.framework" -print0 2>/dev/null \
            | xargs -0 -I{} codesign --force --options runtime --timestamp -s "$IDENTITY" {}
          # App group for Slyy Haven: "<TEAMID>.ai.slyy" (the build left the Team ID prefix empty).
          TEAM=$(echo "$IDENTITY" | sed -E 's/.*\(([A-Z0-9]{10})\)$/\1/')
          ENT="$RUNNER_TEMP/app.entitlements"
          sed -E "s/<string>(\\\$\(TeamIdentifierPrefix\))?ai\.slyy<\/string>/<string>$TEAM.ai.slyy<\/string>/" App/Generated/SlyyMail-macOS.entitlements > "$ENT"
          grep -q "<string>$TEAM.ai.slyy</string>" "$ENT" || { echo "::error::app group not set in entitlements"; cat "$ENT"; exit 1; }
          codesign --force --options runtime --timestamp \
            --entitlements "$ENT" -s "$IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements - "$APP" | grep -q mach-lookup || { echo "::error::app entitlements missing"; exit 1; }
          codesign -d --entitlements - "$APP" | grep -q "$TEAM.ai.slyy" || { echo "::error::app group missing from signature"; exit 1; }

      - name: Note when the build is not notarized
        if: ${{ env.MACOS_CERT_P12 == '' || env.ASC_KEY_P8 == '' }}
        run: echo "::warning::Signing secrets missing; this DMG is not notarized and will not be released."

      - name: Package DMG
        shell: bash
        run: |
          APP="build/Build/Products/Release/Slyy Mailr.app"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Contents/Info.plist")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          lipo -info "$APP/Contents/MacOS/Slyy Mailr"
          echo "Bundle sizes (KB):"
          du -sk "$APP" "$APP/Contents/MacOS" "$APP/Contents/Resources" "$APP/Contents/Frameworks/Sparkle.framework" \
            "$APP/Contents/Frameworks/Sparkle.framework/Versions/B/Resources" "$APP/Contents/Frameworks/Sparkle.framework/Versions/B/Updater.app" \
            "$APP/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices" 2>/dev/null || true
          codesign --verify --deep --verbose=2 "$APP" || true
          mkdir -p dmg dist
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          NAME="slyy-mailr-$VERSION-mac-apple-silicon.dmg"
          hdiutil create -volname "Slyy Mailr $VERSION" -srcfolder dmg -ov -format UDZO "dist/$NAME"
          (cd dist && shasum -a 256 "$NAME" > "$NAME.sha256")
          ls -la dist
          echo "DMG size: $(du -k "dist/$NAME" | cut -f1) KB"

      - name: Notarize and staple DMG (when ASC_KEY_P8 is set)
        if: ${{ env.MACOS_CERT_P12 != '' && env.ASC_KEY_P8 != '' }}
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          DMG=$(ls dist/*.dmg)
          codesign --force --timestamp -s "$SIGN_IDENTITY" "$DMG"
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          # Accept the .p8 either as its PEM text or base64 of it.
          if echo "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then printf '%s\n' "$ASC_KEY_P8" > "$KEY"; else echo "$ASC_KEY_P8" | base64 --decode > "$KEY"; fi
          # Team API keys need the issuer id; Individual API keys must not pass one.
          AUTH=(--key "$KEY" --key-id "$ASC_KEY_ID")
          if [ -n "$ASC_ISSUER_ID" ]; then AUTH+=(--issuer "$ASC_ISSUER_ID"); fi
          xcrun notarytool submit "$DMG" "${AUTH[@]}" --wait --timeout 30m | tee notary.log
          grep -q "status: Accepted" notary.log || { ID=$(awk '/ id:/{print $2; exit}' notary.log); [ -n "$ID" ] && xcrun notarytool log "$ID" "${AUTH[@]}" || true; exit 1; }
          rm "$KEY"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature -v "$DMG"
          (cd dist && shasum -a 256 "$(basename "$DMG")" > "$(basename "$DMG").sha256")

      - name: Sign update and write appcast (Sparkle)
        if: ${{ env.MACOS_CERT_P12 != '' && env.ASC_KEY_P8 != '' && env.SPARKLE_PRIVATE_KEY != '' }}
        shell: bash
        run: |
          APP="build/Build/Products/Release/Slyy Mailr.app"
          BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$APP/Contents/Info.plist")
          DMG="dist/slyy-mailr-$VERSION-mac-apple-silicon.dmg"
          "$RUNNER_TEMP/venv/bin/python" Tools/release/sparkle_sign.py appcast \
            --dmg "$DMG" --version "$VERSION" --build "$BUILD" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$(basename "$DMG")" \
            --notes-file RELEASE_NOTES.md \
            --min-os 14.0 > dist/appcast.xml
          cat dist/appcast.xml
          "$RUNNER_TEMP/venv/bin/python" Tools/release/sparkle_sign.py verify dist/appcast.xml "$DMG"
          echo "APPCAST_READY=1" >> "$GITHUB_ENV"

      - name: Clean up signing keychain
        if: ${{ always() && env.SIGN_KEYCHAIN != '' }}
        shell: bash
        run: security delete-keychain "$SIGN_KEYCHAIN" || true

      - uses: actions/upload-artifact@v5
        with:
          name: slyy-mailr-macos
          path: dist/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: build-logs
          path: "*.log"

      - name: Release new version (main, once per version, notarized and update-signed builds only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.APPCAST_READY == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$VERSION already released; bump MARKETING_VERSION in project.yml to release again."
          else
            # Stable, version-free copy next to the versioned DMG, so
            # https://github.com/mySlyy/slyy-mailr/releases/latest/download/SlyyMailr.dmg
            # always serves the newest release (download button on slyy.ai/tools/mailr).
            mkdir -p stable
            cp "dist/slyy-mailr-$VERSION-mac-apple-silicon.dmg" stable/SlyyMailr.dmg
            (cd stable && shasum -a 256 SlyyMailr.dmg > SlyyMailr.dmg.sha256)
            gh release create "v$VERSION" dist/* stable/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Slyy Mailr $VERSION" --notes-file RELEASE_NOTES.md
            echo "NEW_VERSION=1" >> "$GITHUB_ENV"
          fi

      # iPhone & iPad: every new version (or a manual run with "testflight") goes to TestFlight.
      # Signing is cloud-managed through the App Store Connect API key (no certificates or profiles in the repo).
      - name: TestFlight - check App Store Connect
        id: tf
        if: ${{ env.ASC_KEY_P8 != '' && github.event_name != 'pull_request' && (env.NEW_VERSION == '1' || github.event.inputs.testflight == 'true') }}
        continue-on-error: true
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          test -n "$VERSION" || VERSION=$(grep -E '^ +MARKETING_VERSION:' project.yml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/venv/bin/python" Tools/release/testflight.py preflight

      - name: TestFlight - archive and upload iOS app
        id: tfup
        if: ${{ steps.tf.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          if echo "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then printf '%s\n' "$ASC_KEY_P8" > "$KEY"; else echo "$ASC_KEY_P8" | base64 --decode > "$KEY"; fi
          # Team id from the Developer ID identity: "Developer ID Application: Name (TEAMID)".
          TEAM=$(echo "$SIGN_IDENTITY" | sed -E 's/.*\(([A-Z0-9]{10})\)$/\1/')
          test -n "$TEAM" || { echo "::error::Team id unknown (no Developer ID identity)"; exit 1; }
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild archive -project SlyyMail.xcodeproj -scheme SlyyMail-iOS -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build-ios-release/SlyyMailr.xcarchive \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            "${AUTH[@]}" 2>&1 | tee archive-ios.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive-ios.log
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build-ios-release/SlyyMailr.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath build-ios-release/export \
            "${AUTH[@]}" 2>&1 | tee upload-ios.log | grep -E "error:|Upload|EXPORT (SUCCEEDED|FAILED)" || true
          rm -f "$KEY"
          grep -q "EXPORT SUCCEEDED" upload-ios.log

      - name: TestFlight - publish to testers (public link, 100 max)
        id: tfdist
        if: ${{ steps.tfup.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BETA_FEEDBACK_EMAIL: ${{ secrets.BETA_FEEDBACK_EMAIL }}
          BETA_CONTACT_FIRST_NAME: ${{ secrets.BETA_CONTACT_FIRST_NAME }}
          BETA_CONTACT_LAST_NAME: ${{ secrets.BETA_CONTACT_LAST_NAME }}
          BETA_CONTACT_PHONE: ${{ secrets.BETA_CONTACT_PHONE }}
          BETA_CONTACT_EMAIL: ${{ secrets.BETA_CONTACT_EMAIL }}
          BETA_DEMO_USER: ${{ secrets.BETA_DEMO_USER }}
          BETA_DEMO_PASSWORD: ${{ secrets.BETA_DEMO_PASSWORD }}
        run: |
          "$RUNNER_TEMP/venv/bin/python" Tools/release/testflight.py distribute \
            --build "$GITHUB_RUN_NUMBER" --version "$VERSION" --group "Slyy Testers" --limit 100 --notes RELEASE_NOTES.md

      - uses: actions/upload-artifact@v5
        if: ${{ always() && (steps.tf.outcome == 'failure' || steps.tfup.outcome == 'failure' || steps.tfdist.outcome == 'failure') }}
        with:
          name: testflight-logs
          path: "*-ios.log"
          if-no-files-found: ignore

      - name: TestFlight result
        if: ${{ always() && (steps.tf.outcome == 'failure' || steps.tfup.outcome == 'failure' || steps.tfdist.outcome == 'failure') }}
        run: |
          echo "::error::TestFlight did not complete (check: ${{ steps.tf.outcome }}, upload: ${{ steps.tfup.outcome }}, publish: ${{ steps.tfdist.outcome }}). The Mac release above is not affected."
          exit 1
